<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#07110f" />
<title>Omniverse Finance</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#06100e;--card:#0d1b18;--card2:#10231f;--text:#f4f8f5;--muted:#91aaa2;--line:rgba(255,255,255,.08);--gold:#f3d27a;--green:#56e39b;--red:#ff7d91;--accent:#7cf5bf}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#17483a 0,#0a211b 28%,var(--bg) 65%);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}button,input{font:inherit}.app{max-width:520px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 18px calc(92px + env(safe-area-inset-bottom));min-height:100vh}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.brand{display:flex;gap:11px;align-items:center}.orb{width:40px;height:40px;border-radius:50%;background:conic-gradient(from 20deg,#f7dd83,#59e5a0,#6b8cff,#f7dd83);box-shadow:0 0 30px rgba(86,227,155,.25);position:relative}.orb:after{content:"";position:absolute;inset:6px;border-radius:50%;background:#081410}.brand b{font-size:16px;letter-spacing:.12em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.18em;margin-top:2px}.avatar{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:#10251f;color:var(--gold);font-weight:700}.hero{background:linear-gradient(145deg,rgba(21,55,46,.95),rgba(9,27,23,.92));border:1px solid rgba(124,245,191,.12);border-radius:28px;padding:25px;position:relative;overflow:hidden;box-shadow:0 18px 55px rgba(0,0,0,.25)}.hero:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-90px;top:-90px;background:rgba(243,210,122,.09);filter:blur(4px)}.eyebrow{color:var(--muted);font-size:12px}.balance{font-size:39px;font-weight:800;letter-spacing:-.045em;margin:7px 0 15px}.balance span{font-size:18px;color:var(--muted);font-weight:600}.growth{display:flex;align-items:center;gap:8px;color:var(--green);font-size:13px}.growth i{width:25px;height:25px;border-radius:8px;background:rgba(86,227,155,.1);display:grid;place-items:center;font-style:normal}.goal{margin-top:25px;padding-top:18px;border-top:1px solid var(--line)}.goalrow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:10px}.goalrow span:last-child{color:var(--gold);font-weight:700}.bar{height:8px;background:#17332b;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:12.5%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--gold));box-shadow:0 0 14px rgba(86,227,155,.35)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:15px 0}.action{border:1px solid var(--line);background:rgba(14,31,26,.9);color:var(--text);padding:15px;border-radius:17px;text-align:left;cursor:pointer}.action strong{display:block;font-size:15px;margin-bottom:3px}.action small{color:var(--muted);font-size:11px}.plus{color:var(--green)}.minus{color:var(--red)}.section{margin-top:25px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.sectionhead h2{font-size:15px;margin:0}.sectionhead button{background:none;border:0;color:var(--muted);font-size:12px}.tx{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.txicon{width:40px;height:40px;border-radius:14px;background:#122a23;display:grid;place-items:center}.txmain{flex:1}.txmain b{font-size:13px}.txmain small{display:block;color:var(--muted);margin-top:3px}.amount{font-weight:700;font-size:13px}.income{color:var(--green)}.expense{color:var(--red)}.empty{padding:25px;text-align:center;color:var(--muted);background:rgba(13,27,24,.65);border:1px dashed var(--line);border-radius:17px}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(484px,calc(100% - 24px));padding:8px;background:rgba(8,19,16,.88);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:22px;display:grid;grid-template-columns:repeat(4,1fr);z-index:5}.nav button{background:none;border:0;color:var(--muted);padding:8px 3px;font-size:10px}.nav button span{display:block;font-size:19px;margin-bottom:3px}.nav .active{color:var(--accent)}.modal{position:fixed;inset:0;background:rgba(0,0,0,.58);backdrop-filter:blur(8px);display:none;align-items:flex-end;z-index:10}.modal.open{display:flex}.sheet{width:min(520px,100%);margin:auto auto 0;background:#0b1915;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 18px calc(25px + env(safe-area-inset-bottom))}.sheet h3{margin:0 0 16px}.field{margin:10px 0}.field label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.field input{width:100%;border:1px solid var(--line);background:#10231f;color:var(--text);padding:14px;border-radius:13px;outline:none}.submit{width:100%;margin-top:10px;border:0;background:linear-gradient(90deg,#54e39a,#cde486);color:#07110e;font-weight:800;padding:14px;border-radius:14px}.close{float:right;background:none;border:0;color:var(--muted);font-size:22px}.toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-80px);background:#dff8e9;color:#082017;padding:11px 15px;border-radius:12px;font-size:12px;font-weight:700;z-index:20;transition:.3s}.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="toast" class="toast">Готово</div>
<main class="app">
<header class="top"><div class="brand"><div class="orb"></div><div><b>OMNIVERSE</b><small>FINANCE · MVP 0.1</small></div></div><div class="avatar" id="avatar">S</div></header>
<section class="hero"><div class="eyebrow">МОЯ ФИНАНСОВАЯ ВСЕЛЕННАЯ</div><div class="balance" id="balance">125 430 <span>₽</span></div><div class="growth"><i>↗</i><b id="growth">+8 240 ₽</b><span>за месяц</span></div><div class="goal"><div class="goalrow"><span>Цель · Первый миллион</span><span id="goalPct">12.5%</span></div><div class="bar"><i id="goalBar"></i></div></div></section>
<div class="actions"><button class="action" onclick="openModal('income')"><strong class="plus">＋ Доход</strong><small>Добавить деньги во Вселенную</small></button><button class="action" onclick="openModal('expense')"><strong class="minus">− Расход</strong><small>Зафиксировать движение</small></button></div>
<section class="section"><div class="sectionhead"><h2>Последние движения</h2><button onclick="clearTx()">очистить</button></div><div id="transactions"></div></section>
</main>
<nav class="nav"><button class="active"><span>◉</span>Вселенная</button><button onclick="toast('Раздел «Цели» — следующий модуль')"><span>◎</span>Цели</button><button onclick="toast('Аналитика — следующий модуль')"><span>◌</span>Аналитика</button><button onclick="toast('Профиль — следующий модуль')"><span>◯</span>Профиль</button></nav>
<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h3 id="modalTitle">Новый доход</h3><div class="field"><label>СУММА, ₽</label><input id="amount" type="number" inputmode="decimal" placeholder="0"></div><div class="field"><label>НАЗВАНИЕ</label><input id="note" type="text" placeholder="Например, зарплата"></div><button class="submit" onclick="addTx()">Добавить во Вселенную</button></div></div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();document.body.style.backgroundColor=tg.themeParams?.bg_color||'#06100e';const u=tg.initDataUnsafe?.user;if(u){document.getElementById('avatar').textContent=(u.first_name||u.username||'S')[0].toUpperCase()}}
let tx=JSON.parse(localStorage.getItem('omniverse_tx')||'null')||[{type:'income',amount:8240,note:'Работа',date:'Сегодня'},{type:'expense',amount:2190,note:'Дом',date:'Сегодня'},{type:'income',amount:3500,note:'Проект',date:'Вчера'}];let mode='income';
function fmt(n){return new Intl.NumberFormat('ru-RU').format(Math.round(n))}
function render(){const income=tx.filter(x=>x.type==='income').reduce((a,x)=>a+x.amount,0),expense=tx.filter(x=>x.type==='expense').reduce((a,x)=>a+x.amount,0),balance=125430+income-expense-9550;document.getElementById('balance').innerHTML=fmt(balance)+' <span>₽</span>';document.getElementById('growth').textContent=(income-expense>=0?'+':'')+fmt(income-expense)+' ₽';const pct=Math.min(100,Math.max(0,balance/1000000*100));document.getElementById('goalPct').textContent=pct.toFixed(1)+'%';document.getElementById('goalBar').style.width=pct+'%';const el=document.getElementById('transactions');el.innerHTML=tx.length?tx.slice().reverse().slice(0,6).map(x=>`<div class="tx"><div class="txicon">${x.type==='income'?'↗':'↘'}</div><div class="txmain"><b>${escapeHtml(x.note)}</b><small>${x.date}</small></div><div class="amount ${x.type}">${x.type==='income'?'+':'−'}${fmt(x.amount)} ₽</div></div>`).join(''):'<div class="empty">Пока нет движений.<br>Добавь первый доход или расход.</div>';localStorage.setItem('omniverse_tx',JSON.stringify(tx))}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function openModal(t){mode=t;document.getElementById('modalTitle').textContent=t==='income'?'Новый доход':'Новый расход';document.getElementById('amount').value='';document.getElementById('note').value='';document.getElementById('modal').classList.add('open');setTimeout(()=>document.getElementById('amount').focus(),100)}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function addTx(){const amount=Number(document.getElementById('amount').value),note=document.getElementById('note').value.trim()|| (mode==='income'?'Доход':'Расход');if(!amount||amount<=0){toast('Укажи сумму');return}tx.push({type:mode,amount,note,date:'Сегодня'});render();closeModal();toast(mode==='income'?'Доход добавлен ✦':'Расход добавлен')}
function clearTx(){if(confirm('Очистить историю MVP?')){tx=[];render();toast('История очищена')}}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
render();
</script>
</body></html>
